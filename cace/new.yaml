#--------------------------------------------------------------
# CACE circuit characterization file
#--------------------------------------------------------------

name:           io_inv_1
description:    A simple inverter
PDK:            gf180mcuD

cace_format:    5.2

authorship:
  designer:         Subhransu Das
  creation_date:    Jan 10, 2025
  license:          MIT license

paths:
  root:             ..
  schematic:        xschem
  netlist:          netlist
  documentation:    docs

pins:
  VDD:
    description: Positive analog power supply
    type: power
    direction: inout
    Vmin: 1.7
    Vmax: 1.9
  VSS:
    description: Analog ground
    type: ground
    direction: inout
  Vin:
    description:  Voltage input
    type: signal
    direction: input 
  Vout:
    description: Voltage output
    type: signal
    direction: output

default_conditions:
  vdd:
    description: Analog power supply voltage
    display: Vdd
    unit: V
    typical: 1.8
  vin:
    description: Voltage input
    display: Vin
    unit: V
    typical: 1.8 
  cl:
    description: Output load capacitance
    display: CLoad
    unit: fF
    maximum: 1
  corner:
    description: Process corner
    display: Corner
    typical: tt
  temperature:
    description: Ambient temperature
    display: Temp
    unit: °C
    typical: 27

parameters: 
  time_response:
    description: Time response
    display: Time response
    status: skip
    unit: ns
    tool:
      ngspice:
        template: io_inv_1_time.sch
        format: ascii
        suffix: .data
        variables: [tr1090, tf9010, tdrise, tdfall]
        jobs: 4
    variables:
      tr1090:
        display: Time
        unit: ns
      tf9010:
        display: Time
        unit: ns
      tdrise:
        display: Time
        unit: ns
      tdfall:
        display: Time
        unit: ns    
    conditions:
      Tmax:
        display: Simulation time
        unit: ns
        typical: 50
      temperature:
        enumerate: [ 27]  
      corner:
        enumerate: [ typical ]
